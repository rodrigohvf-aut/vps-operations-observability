name: observability-control

services:
  dashboard:
    image: nginx:stable-alpine
    container_name: observability-control-dashboard
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.observability-control.rule=Host(`controle.example.invalid`)"
      - "traefik.http.routers.observability-control.entrypoints=websecure"
      - "traefik.http.routers.observability-control.tls.certresolver=letsencrypt"
      - "traefik.http.services.observability-control.loadbalancer.server.port=80"
    volumes:
      - /opt/observability/repository/dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - /etc/observability/dashboard-config.js:/usr/share/nginx/html/config.js:ro
      - /opt/observability/repository/infra/dashboard/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - observability-control

networks:
  observability-control:
    external: true
