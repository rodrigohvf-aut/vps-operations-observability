name: observability-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: observability-api
    restart: unless-stopped
    env_file:
      - /etc/observability/api.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - /run/observability:/run/observability:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - observability-control

networks:
  observability-control:
    external: true
